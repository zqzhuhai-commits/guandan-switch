name: Publish verified v0.5.0 NSP and screenshots
on:
  push:
    branches: [main]
    paths: ['release/v0.5.0/**', '.github/workflows/publish-nsp.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore locally verified NSP and resources
        run: |
          python3 tools/restore_assets.py
          python3 tools/restore_native_nsp.py
      - name: Fetch the exact native build used to package the NSP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path('release/v0.5.0/native-nsp.json').read_text())
          run=json.loads(subprocess.check_output(['gh','run','view',str(m['build_run']),'--json','headSha,conclusion'],text=True))
          assert run['headSha']==m['build_commit'] and run['conclusion']=='success'
          subprocess.run(['gh','run','download',str(m['build_run']),'-n','switch-native-build','-D','dist'],check=True)
          import hashlib
          assert hashlib.sha256(Path('dist/GuandanSwitch.nro').read_bytes()).hexdigest()==m['nro_sha256']
          Path('dist/BUILD-SOURCE-COMMIT.txt').write_text(m['build_commit']+'\n')
          PY
      - name: Bundle new NSP, NRO, screenshots and source
        run: python3 tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GuandanSwitch-v0.5.0-with-NSP
          path: |
            dist/GuandanTime.nsp
            dist/GuandanSwitch.nro
            dist/GuandanSwitch-v0.5.0.zip
            dist/SHA256SUMS.txt
      - name: Publish v0.5.0 without replacing prior versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.5.0 dist/GuandanTime.nsp dist/GuandanSwitch.nro dist/GuandanSwitch-v0.5.0.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title '掼蛋时光 v0.5.0 · 参考牌桌重制与默认竖向理牌 测试版' --notes-file dist/RELEASE-NOTES.md --prerelease
